<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Biel Strategy | Marketing de Aquisição, Tecnologia &amp; IA</title>
<meta name="description" content="Estrategista de aquisição e soluções digitais: mídia de intenção, engenharia de conversão e inteligência artificial em uma operação única.">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/fonts.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/colors.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/typography.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/spacing.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/radius.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/elevation.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/motion.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/tokens/base.css">
<link rel="stylesheet" href="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/styles.css">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--surface-page);color:var(--text-body);font:var(--type-body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:100;opacity:.025;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover)}
h1,h2,h3,h4,h5{margin:0;font-family:var(--font-display);color:var(--text-strong);letter-spacing:-.02em;text-wrap:balance}
p{margin:0;text-wrap:pretty}
.ac{color:var(--carmesim-500)}
:root{--marg:clamp(20px,7vw,104px);--maxw:1320px}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.rv-on{opacity:1;transform:none}
.hl{opacity:0;transform:translateY(18px);animation:hlReveal .9s cubic-bezier(.16,1,.3,1) both}
@keyframes hlReveal{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.rv{opacity:1;transform:none;transition:none}.hl{animation:none;opacity:1;transform:none}html{scroll-behavior:auto}}

/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px var(--marg);background:linear-gradient(to bottom,rgba(10,10,10,.94),rgba(10,10,10,0));backdrop-filter:blur(6px)}
.nav-links{display:flex;gap:26px;flex-wrap:wrap}
.nav-links a{font:var(--weight-medium) 12px/1 var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-muted)}
.nav-links a:hover{color:var(--white)}
.nav-cta{font:var(--weight-bold) 11px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--white);border:1px solid var(--carmesim-500);padding:11px 16px;transition:var(--transition-control,.2s),transform .25s cubic-bezier(.16,1,.3,1)}
.nav-cta:hover{background:var(--carmesim-500);color:#fff}
@media(max-width:1080px){.nav-links{display:none}}

/* progresso lateral */
.prog{position:fixed;right:calc(var(--marg) / 2);top:50%;transform:translateY(-50%);z-index:55;display:flex;flex-direction:column;gap:10px}
.prog i{width:2px;height:14px;background:var(--border-muted);display:block;transition:.4s}
.prog i.on{background:var(--carmesim-500);height:28px}
@media(max-width:1100px){.prog{display:none}}

/* hero */
.hero{min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:120px var(--marg) 0;position:relative}
.hero-grid{max-width:var(--maxw);margin:0 auto;width:100%;display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.85fr);gap:clamp(32px,5vw,80px);align-items:center}
.hero-kicker{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:clamp(28px,4vw,48px)}
.hero-sep{width:36px;height:1px;background:var(--border-strong)}
.hero-role{font:var(--weight-medium) 12px/1.4 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--text-muted)}
.hero-title{display:flex;flex-direction:column;gap:.1em;font-weight:800;line-height:1.02;text-transform:uppercase;letter-spacing:-.03em}
.hl-1{font-size:clamp(40px,6.6vw,104px)}
.hl-2{font-size:clamp(24px,3.4vw,48px);color:var(--gray-100)}
.hl-3{font-size:clamp(16px,2.05vw,29px);color:var(--gray-400)}
.hero-lede{max-width:56ch;margin-top:clamp(26px,3.5vw,40px)}
.hero-lede p{font:var(--weight-regular) clamp(15px,1.15vw,18px)/1.75 var(--font-sans);color:var(--text-body)}
.hero-cta{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:36px}
.link-quiet{font:var(--weight-medium) 13px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-muted)}
.link-quiet:hover{color:var(--white)}
.hero-note{margin-top:28px;font:var(--weight-regular) 12px/1.6 var(--font-sans);color:var(--text-faint)}
.hero-portrait{position:relative;aspect-ratio:4/5;background:var(--surface-page);overflow:hidden}
.hero-portrait-in{animation:heroPortraitIn 1.15s .35s cubic-bezier(.16,1,.3,1) both}
@keyframes heroPortraitIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-portrait-in{animation:none}}
.hero-portrait image-slot{filter:grayscale(.25) contrast(1.08) brightness(.92) saturate(.9)}
.hero-portrait::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(10,10,10,0) 55%,rgba(10,10,10,.65) 100%),linear-gradient(0deg,rgba(10,10,10,.18),rgba(10,10,10,.18));mix-blend-mode:normal}
.hero-portrait image-slot,.caso-media image-slot{position:absolute;inset:0}
.portrait-cap{position:absolute;left:0;bottom:-26px;font:var(--weight-regular) 11px/1 var(--font-sans);letter-spacing:.1em;text-transform:uppercase;color:var(--text-faint)}
.hero-foot{max-width:var(--maxw);margin:clamp(48px,7vh,96px) auto 0;width:100%;display:flex;gap:clamp(16px,3vw,44px);flex-wrap:wrap;align-items:baseline;padding-bottom:44px;border-top:1px solid var(--border-hairline);padding-top:22px}
.axis{font-family:var(--font-display);text-transform:uppercase;letter-spacing:-.01em}
.axis-1{font-weight:800;font-size:clamp(15px,1.5vw,21px);color:var(--white)}
.axis-2{font-weight:700;font-size:clamp(13px,1.15vw,16px);color:var(--gray-300)}
.axis-3{font-weight:600;font-size:clamp(11px,.95vw,13px);color:var(--gray-500)}
.axis-4{font-weight:600;font-size:11px;color:var(--gray-600)}
@media(max-width:860px){.hero-grid{grid-template-columns:1fr}.hero-portrait{order:-1;aspect-ratio:3/2;max-width:420px}}

/* seções */
.sec{padding:clamp(80px,11vh,160px) var(--marg);max-width:calc(var(--maxw) + 2 * var(--marg));margin:0 auto}
.sec-hero{padding-top:clamp(96px,14vh,200px)}
.sec-jornada{padding-top:clamp(64px,9vh,130px);padding-bottom:clamp(16px,2vh,32px)}
.sec-mkt{padding-top:clamp(32px,4vh,56px)}
.sec-head{margin-bottom:clamp(40px,6vh,80px)}
.chapmark{display:flex;align-items:center;gap:16px}
.chapmark-n{font:var(--weight-black) 12px/1 var(--font-display);color:var(--carmesim-500);letter-spacing:.1em}
.chapmark-l{font:var(--weight-bold) 11px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted)}
.kicker{font:var(--weight-bold) 11px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-muted);margin-bottom:18px}
.kicker-accent{color:var(--carmesim-500)}
.sec-title{text-transform:uppercase;font-weight:800;line-height:1.05;letter-spacing:-.025em}
.sec-title-lg{font-size:clamp(30px,4.2vw,62px)}
.rule{display:block;width:64px;height:2px;background:var(--rule-accent);margin-top:clamp(20px,2.5vw,30px);transform-origin:left center;animation:ruleWipe .7s cubic-bezier(.16,1,.3,1) both;animation-timeline:view();animation-range:entry 0% cover 25%}
@keyframes ruleWipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion:reduce){.rule{animation:none}}
.two-col{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,1.15fr);gap:clamp(40px,8vw,120px)}
.sec-jornada .two-col{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.col-body{display:flex;flex-direction:column;gap:26px;padding-top:8px;min-width:0}
.traj-intro .col-body{padding-top:14px}
.lede{font:var(--weight-regular) clamp(16px,1.3vw,20px)/1.7 var(--font-sans);color:var(--gray-100);max-width:60ch}
.col-body p{font:var(--weight-regular) 16px/1.75 var(--font-sans);color:var(--text-body);max-width:62ch}
@media(max-width:860px){.two-col{grid-template-columns:1fr}}
.pending{font:var(--weight-bold) 11px/1.4 var(--font-sans);letter-spacing:.1em;color:var(--carmesim-400);text-transform:uppercase}
.ev{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;color:var(--text-faint);border:1px solid var(--border-hairline);padding:5px 8px;white-space:nowrap}
.ev-ac{color:var(--carmesim-400);border-color:var(--carmesim-700)}

/* quem */
.quem-axes{display:grid;gap:0;margin-top:14px;border-top:1px solid var(--border-hairline)}
.qa{padding:22px 0;border-bottom:1px solid var(--border-hairline)}
.qa-n{font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--carmesim-500)}
.qa h3{font-size:19px;font-weight:700;margin:10px 0 8px;text-transform:none;letter-spacing:-.01em}
.qa p{font:var(--weight-regular) 14.5px/1.7 var(--font-sans);color:var(--text-muted);max-width:58ch}
.qa-faint .qa-n{color:var(--text-faint)}.qa-faint h3{color:var(--gray-300);font-weight:600}

/* trajetória */
.traj-intro{max-width:760px;margin-bottom:clamp(56px,9vh,100px)}
.traj-lede{margin-top:28px}
.traj{display:grid;grid-template-columns:170px minmax(0,1fr);gap:clamp(24px,5vw,80px)}
.traj-rail{position:relative}
.rail-inner{position:sticky;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:18px;padding-left:16px}
.rail-inner::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1px;background:var(--border-hairline);z-index:0}
.rail-inner::after{content:"";position:absolute;left:5px;top:6px;width:1px;background:var(--carmesim-500);z-index:1;transition:height .5s cubic-bezier(.16,1,.3,1);height:var(--rail-fill,0%)}
.rail-item{display:flex;align-items:center;gap:12px;opacity:.35;transition:.5s}
.rail-item.on{opacity:1}
.rail-n{font:var(--weight-black) 12px/1 var(--font-display);color:var(--text-faint)}
.rail-item.on .rail-n{color:var(--carmesim-500)}
.rail-line{width:14px;height:1px;background:var(--border-strong);transition:.5s}
.rail-item.on .rail-line{width:26px;background:var(--carmesim-500)}
.rail-w{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint)}
.rail-item.on .rail-w{color:var(--white)}
.traj-flow{display:flex;flex-direction:column}
.fase{min-height:56vh;display:flex;flex-direction:column;justify-content:center;padding:clamp(20px,3vh,32px) 0;border-top:1px solid var(--border-hairline);transition:opacity .4s}
.fase:first-child{border-top:0}
.fase header{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.fase-n{font:var(--weight-black) clamp(34px,4.6vw,64px)/1 var(--font-display);color:var(--black-700);letter-spacing:-.04em}
.fase-on .fase-n{color:var(--carmesim-500)}
.fase-w{font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--text-faint)}
.fase-on .fase-w{color:var(--gray-200)}
.fase h3{font-size:clamp(20px,2.3vw,31px);font-weight:800;text-transform:uppercase;line-height:1.12;max-width:22ch;letter-spacing:-.02em}
.fase-ctx{margin-top:18px;font:var(--weight-regular) clamp(15px,1.1vw,17px)/1.75 var(--font-sans);color:var(--gray-100);max-width:62ch}
.fase dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px;margin:30px 0 0}
.fase dt{font:var(--weight-bold) 10px/1.3 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--carmesim-500);margin-bottom:10px}
.fase dd{margin:0;font:var(--weight-regular) 14.5px/1.7 var(--font-sans);color:var(--text-muted)}
@media(max-width:860px){.traj{grid-template-columns:1fr}.traj-rail{display:none}}

/* marketing */
.sec-mkt{position:relative}
.mkt-open{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:clamp(32px,6vw,90px);align-items:end;margin-bottom:clamp(64px,10vh,140px)}
.mega{font-size:clamp(27px,4.6vw,80px);font-weight:800;text-transform:uppercase;line-height:1.03;letter-spacing:-.03em}
.mkt-open-side p{font:var(--weight-regular) 15.5px/1.75 var(--font-sans);color:var(--text-muted);margin-top:24px;max-width:44ch}
@media(max-width:860px){.mkt-open{grid-template-columns:1fr}}
.funil,.ciclo,.metricas,.disc{margin-top:clamp(64px,10vh,132px)}
.funil-head h3,.metricas h3,.ciclo-h{font-size:clamp(22px,2.7vw,38px);font-weight:800;text-transform:uppercase;letter-spacing:-.02em}
.funil-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:36px}
.funil-cards h4{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:.01em;margin-bottom:12px;position:relative}
.funil-cards p{font:var(--weight-regular) 14.5px/1.7 var(--font-sans);color:var(--text-muted)}
.ghost-n{position:absolute;right:0;top:-18px;font:var(--weight-black) 64px/1 var(--font-display);color:rgba(255,255,255,.045);pointer-events:none}
.funil-cards>div{position:relative;overflow:hidden}
.funil-flow{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:44px;padding-left:2px}
.ff-step{font:var(--weight-bold) 12px/1 var(--font-sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gray-200)}
.ff-arrow{color:var(--carmesim-500);font-size:13px;line-height:1}
.ciclo-track{display:flex;gap:12px;margin-top:40px;flex-wrap:wrap}
.met-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:34px}
.met-quote{margin-top:44px;max-width:70ch}
.disc-list{border-top:1px solid var(--border-hairline);margin-top:26px}
.disc-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:clamp(18px,4vw,56px);padding:22px 0;border-bottom:1px solid var(--border-hairline)}
.disc-t{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.disc-t h4{font-size:16px;font-weight:700;text-transform:none;letter-spacing:0}
.dot{width:7px;height:7px;border-radius:50%;background:var(--carmesim-500);flex:0 0 7px}
.disc-row p{font:var(--weight-regular) 14.5px/1.7 var(--font-sans);color:var(--text-muted)}
@media(max-width:760px){.disc-row{grid-template-columns:1fr;gap:12px}}

/* tecnologia */
.gargalos{margin-top:clamp(56px,9vh,110px)}
.garg{display:grid;grid-template-columns:56px minmax(0,1fr) 40px minmax(0,1fr);gap:clamp(12px,2vw,28px);align-items:start;padding:30px 0;border-top:1px solid var(--border-hairline)}
.garg-i span{font:var(--weight-black) 22px/1 var(--font-display);color:var(--black-700)}
.garg-l{display:block;font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint);margin-bottom:12px}
.garg-l-ac{color:var(--carmesim-500)}
.garg-p h4{font-size:17px;font-weight:700;text-transform:none;letter-spacing:0;margin-bottom:10px}
.garg p{font:var(--weight-regular) 14.5px/1.7 var(--font-sans);color:var(--text-muted)}
.garg-arrow{color:var(--carmesim-500);font-size:18px;padding-top:22px;text-align:center}
@media(max-width:860px){.garg{grid-template-columns:1fr;gap:16px}.garg-arrow{display:none}.garg-i span{font-size:16px}}
.chips{margin-top:clamp(48px,7vh,90px)}
.chips-row{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--border-hairline);background:var(--surface-card);font:var(--weight-medium) 13.5px/1 var(--font-sans);color:var(--gray-100);position:relative;overflow:hidden}
.chip-sm{padding:8px 12px;font-size:12.5px;color:var(--text-muted)}
.cred-more{display:inline-block;margin-top:22px}
.stack-strip{max-width:calc(var(--maxw) + 2 * var(--marg));margin:0 auto;padding:36px var(--marg);display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:22px;border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)}
.ss-item{display:flex;flex-direction:column;gap:6px}
.ss-t{font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--carmesim-500)}
.ss-d{font:var(--weight-regular) 13px/1.5 var(--font-sans);color:var(--text-muted)}

/* ia */
.ia-cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:clamp(24px,4vw,56px);margin-top:clamp(48px,8vh,96px)}
.ia-tag{display:inline-block;font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--carmesim-500);padding-bottom:16px;border-bottom:2px solid var(--carmesim-500)}
.ia-col ul{list-style:none;padding:0;margin:26px 0 0;display:flex;flex-direction:column;gap:22px}
.ia-col li{font:var(--weight-regular) 15px/1.75 var(--font-sans);color:var(--text-muted);padding-left:20px;position:relative}
.ia-col li::before{content:"";position:absolute;left:0;top:.65em;width:7px;height:7px;border-radius:50%;background:var(--carmesim-500)}
.ia-col strong{color:var(--white);font-weight:600}
.ia-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin-top:clamp(48px,7vh,88px);border-top:1px solid var(--border-hairline);border-left:1px solid var(--border-hairline)}
@media(min-width:820px){.ia-tools{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ia-tool{background:var(--surface-page);padding:26px 22px;border-right:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline);position:relative;overflow:hidden}
.ia-tool h5{font:var(--weight-bold) 14px/1.3 var(--font-display);color:var(--white);margin-bottom:10px}
.ia-tool p{font:var(--weight-regular) 13px/1.6 var(--font-sans);color:var(--text-faint)}

/* casos */
.casos-nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;border-top:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline)}
.caso-tab{background:none;border:0;border-left:1px solid var(--border-hairline);text-align:left;padding:22px 20px;cursor:pointer;display:flex;flex-direction:column;gap:10px;transition:.25s;position:relative;overflow:hidden}
.caso-tab:first-child{border-left:0}
.caso-tab:hover{background:var(--surface-card)}
.caso-tab.on{background:var(--surface-card);box-shadow:inset 0 2px 0 var(--carmesim-500)}
.caso-tab-e{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}
.caso-tab.on .caso-tab-e{color:var(--carmesim-500)}
.caso-tab-t{font:var(--weight-bold) 15px/1.3 var(--font-display);color:var(--gray-300)}
.caso-tab.on .caso-tab-t{color:var(--white)}
.caso{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.9fr);gap:clamp(28px,5vw,72px);margin-top:clamp(40px,6vh,72px);animation:fadeUp .7s cubic-bezier(.16,1,.3,1)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.caso-eixo{font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--carmesim-500)}
.caso h3{font-size:clamp(24px,3vw,42px);font-weight:800;text-transform:uppercase;letter-spacing:-.025em;margin:16px 0 10px;line-height:1.08}
.caso-sub{font:var(--weight-regular) 14px/1.6 var(--font-sans);color:var(--text-faint);letter-spacing:.02em}
.caso-block{margin-top:32px}
.caso-l{display:block;font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-muted);margin-bottom:14px}
.caso-block p{font:var(--weight-regular) 15.5px/1.75 var(--font-sans);color:var(--gray-100);max-width:60ch}
.caso-block ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.caso-block li{font:var(--weight-regular) 15px/1.7 var(--font-sans);color:var(--text-muted);padding-left:20px;position:relative}
.caso-block li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--carmesim-500)}
.caso-media{position:relative;aspect-ratio:1;border:1px solid var(--border-hairline);align-self:start}
@media(max-width:860px){.caso{grid-template-columns:1fr}}

/* stack */
.niveis{margin-top:clamp(48px,8vh,96px);display:flex;flex-direction:column}
.nivel{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:clamp(18px,4vw,56px);padding:clamp(24px,3.4vh,40px) 0;border-top:1px solid var(--border-hairline)}
.nivel-n{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint)}
.nivel-h h3{text-transform:uppercase;font-weight:800;letter-spacing:-.02em;margin-top:12px}
.nivel-dominante h3{font-size:clamp(28px,3.6vw,52px);color:var(--white)}
.nivel-dominante .nivel-n{color:var(--carmesim-500)}
.nivel-forte h3{font-size:clamp(21px,2.4vw,34px);color:var(--gray-100)}
.nivel-medio h3{font-size:clamp(17px,1.7vw,24px);color:var(--gray-200)}
.nivel-fundacao h3{font-size:16px;color:var(--gray-400)}
.nivel-itens{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;padding-top:6px}
.nivel-item{font:var(--weight-medium) 13.5px/1 var(--font-sans);color:var(--text-body);border:1px solid var(--border-hairline);padding:11px 14px;position:relative;overflow:hidden}
.nivel-dominante .nivel-item{color:var(--white);border-color:var(--carmesim-700);background:var(--carmesim-tint);font-weight:600}
.nivel-fundacao .nivel-item{color:var(--text-faint);font-size:12.5px}
@media(max-width:760px){.nivel{grid-template-columns:1fr}}

/* formação */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:clamp(32px,5vw,72px);margin-top:clamp(48px,8vh,96px)}
.grad{border-left:2px solid var(--carmesim-500);padding:4px 0 4px 20px}
.grad h4{font-size:17px;font-weight:700;text-transform:none;letter-spacing:0;margin-bottom:8px}
.grad p{font:var(--weight-regular) 14px/1.6 var(--font-sans);color:var(--text-muted)}
.cursos{list-style:none;padding:0;margin:0;border-top:1px solid var(--border-hairline)}
.cursos li{padding:20px 0;border-bottom:1px solid var(--border-hairline)}
.curso-h{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.cursos h5{font:var(--weight-bold) 15px/1.35 var(--font-display);color:var(--white)}
.cursos p{font:var(--weight-regular) 13.5px/1.65 var(--font-sans);color:var(--text-faint)}
.st{font:var(--weight-bold) 9px/1 var(--font-sans);letter-spacing:.16em;text-transform:uppercase;padding:5px 8px;border:1px solid var(--border-hairline);color:var(--text-faint);white-space:nowrap}
.st-ok{color:var(--white);border-color:var(--border-strong)}
.st-go{color:var(--carmesim-400);border-color:var(--carmesim-700)}
.certs{display:flex;flex-direction:column;border-top:1px solid var(--border-hairline)}
.cert{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;padding:20px 0;border-bottom:1px solid var(--border-hairline);flex-wrap:wrap}
.cert-inst{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--carmesim-500)}
.cert h5{font:var(--weight-bold) 15px/1.35 var(--font-display);color:var(--white);margin:8px 0 6px}
.cert-plat{font:var(--weight-regular) 12.5px/1 var(--font-sans);color:var(--text-faint)}
.cert-r{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.cert-empty{justify-content:center;padding:22px 0;border-bottom:1px dashed var(--border-hairline)}
.cert-empty span{font:var(--weight-medium) 12px/1 var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--text-faint)}

/* visão */
.visao-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-top:1px solid var(--border-hairline);border-left:1px solid var(--border-hairline);margin-top:clamp(48px,8vh,96px)}
@media(min-width:820px){.visao-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.vc{background:var(--surface-page);padding:32px 26px;border-right:1px solid var(--border-hairline);border-bottom:1px solid var(--border-hairline);position:relative;overflow:hidden}
.vc-st{font:var(--weight-bold) 9.5px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--carmesim-500)}
.vc h4{font-size:19px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em;margin:16px 0 12px}
.vc p{font:var(--weight-regular) 14px/1.7 var(--font-sans);color:var(--text-muted)}

/* fechamento */
.fim{padding:clamp(100px,16vh,220px) var(--marg) 0;position:relative}
.fim::before{content:"";position:absolute;top:0;left:var(--marg);right:var(--marg);height:1px;background:var(--border-hairline)}
.fim-inner{max-width:var(--maxw);margin:0 auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.fim-kicker{font:var(--weight-bold) 11px/1 var(--font-sans);letter-spacing:.28em;text-transform:uppercase;color:var(--carmesim-500)}
.fim-title{margin-top:36px;font-size:clamp(28px,5vw,74px);font-weight:800;text-transform:uppercase;line-height:1.05;letter-spacing:-.03em}
.fim-lede{margin-top:32px;max-width:56ch;font:var(--weight-regular) clamp(15px,1.2vw,18px)/1.75 var(--font-sans);color:var(--text-muted)}
.fim-cta{margin-top:44px}
.fim-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;margin-top:clamp(64px,10vh,120px);width:100%;max-width:840px;border-top:1px solid var(--border-hairline);padding-top:36px}
.fim-meta div{display:flex;flex-direction:column;gap:10px}
.fim-meta span{font:var(--weight-bold) 10px/1 var(--font-sans);letter-spacing:.2em;text-transform:uppercase;color:var(--text-faint)}
.fim-foot{max-width:var(--maxw);margin:clamp(64px,9vh,110px) auto 0;padding:26px 0 40px;border-top:1px solid var(--border-hairline);display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;font:var(--weight-medium) 11px/1.5 var(--font-sans);letter-spacing:.18em;text-transform:uppercase;color:var(--text-faint)}
.fim-foot>span:first-child{font-weight:700;color:var(--white)}
.chip::before,.caso-tab::before,.nivel-item::before,.vc::before,.ia-tool::before{content:"";position:absolute;left:var(--mx,50%);top:var(--my,50%);width:180px;height:180px;transform:translate(-50%,-50%);background:radial-gradient(circle,var(--carmesim-glow),transparent 72%);opacity:0;transition:opacity .35s;pointer-events:none;z-index:0}
.chip:hover::before,.caso-tab:hover::before,.nivel-item:hover::before,.vc:hover::before,.ia-tool:hover::before{opacity:1}
@media(hover:none){.chip::before,.caso-tab::before,.nivel-item::before,.vc::before,.ia-tool::before{display:none}}
</style>
</head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds/biel-strategy-design-system-2981ad14-deb6-40a2-8f05-54d5b9f2147a/_ds_bundle.js"></script>
<script src="image-slot.js"></script>

<script type="text/babel" src="bs-construcao.jsx"></script>
<script type="text/babel">
const {Wordmark}=window.BielStrategyDesignSystem_2981ad;
ReactDOM.createRoot(document.getElementById('nav-mark')).render(<Wordmark size={13}/>);

function App(){
  useReveal();
  return (<>
    <Hero/><Jornada/><Marketing/><Casos/><Tecnologia/><IA/><StackStrip/><Formacao/><Visao/><Fechamento/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);

/* indicador de capítulo */
const IDS=['hero','jornada','marketing','casos','tecnologia','ia','formacao','visao','contato'];
const prog=document.getElementById('prog');
IDS.forEach(()=>prog.appendChild(document.createElement('i')));
setTimeout(()=>{
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){const i=IDS.indexOf(e.target.id);prog.querySelectorAll('i').forEach((b,j)=>b.classList.toggle('on',j===i))}})},{rootMargin:'-45% 0px -45% 0px'});
  IDS.forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el)});
},600);

document.addEventListener('pointermove',e=>{
  const t=e.target.closest('.chip,.caso-tab,.nivel-item,.vc,.ia-tool');
  if(!t)return;
  const r=t.getBoundingClientRect();
  t.style.setProperty('--mx',(e.clientX-r.left)+'px');
  t.style.setProperty('--my',(e.clientY-r.top)+'px');
});
document.querySelectorAll('.nav-cta').forEach(btn=>{
  btn.addEventListener('mousemove',e=>{
    const r=btn.getBoundingClientRect();
    btn.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.2}px,${(e.clientY-r.top-r.height/2)*.35}px)`;
  });
  btn.addEventListener('mouseleave',()=>{btn.style.transform='';});
});
</script>
